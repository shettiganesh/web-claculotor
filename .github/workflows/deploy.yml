name: Web Calculator

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Files
        run: |
          echo "Web Calculator Application"
          echo "Files in project:"
          ls -la

      - name: Check index.html
        run: |
          test -f index.html
          echo "index.html exists"

      - name: Deployment Success
        run: echo "Web Calculator workflow completed successfully!"
